backend:
  name: github
  repo: LaruX75/Generation-AI-STN-project-website
  branch: main
  base_url: https://sveltia-cms-auth.fc4ydtm5bs.workers.dev

local_backend: true
publish_mode: simple
media_folder: "media/wp-content/uploads"
public_folder: "/media/wp-content/uploads"
site_url: https://generation-ai-stn.fi
display_url: https://generation-ai-stn.fi
locale: "fi"

i18n:
  structure: multiple_folders
  locales: [fi, en, sv]
  default_locale: fi

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # ── JULKAISUT (FI / EN / SV — i18n) ───────────────────────────────────────
  - name: "posts"
    label: "Julkaisut"
    label_singular: "Julkaisu"
    icon: "newspaper"
    folder: "content/posts"
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    preview_path:
      fi: "ajankohtaista/{{slug}}"
      en: "en/current-affairs/{{slug}}"
      sv: "sv/nyheter-fran/{{slug}}"
    sortable_fields:
      fields: ["date", "title"]
      default:
        field: date
        direction: Descending
    view_filters:
      - label: "Mediassa"
        field: mainCategory
        pattern: "Mediassa"
      - label: "Tapahtumat"
        field: mainCategory
        pattern: "Tapahtumat"
      - label: "Toiminta"
        field: mainCategory
        pattern: "Toiminta"
      - label: "Tutkimus"
        field: mainCategory
        pattern: "Tutkimus"
      - label: "Research (EN)"
        field: mainCategory
        pattern: "Research"
      - label: "Forskning (SV)"
        field: mainCategory
        pattern: "Forskning"
    view_groups:
      - label: "Kategoria"
        field: mainCategory
      - label: "Vuosi"
        field: date
        pattern: "\\d{4}"
    fields:
      - label: "Otsikko / Title / Titel"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Päivämäärä / Date / Datum"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss"
        i18n: duplicate
      - label: "Päivitetty / Updated / Uppdaterad"
        name: "updated"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ss"
        required: false
        i18n: duplicate
      - label: "Pääkategoria / Main category / Huvudkategori"
        name: "mainCategory"
        widget: "select"
        required: false
        i18n: true
        options:
          # ── Suomi ──
          - { label: "Mediassa (fi)", value: "Mediassa" }
          - { label: "Tapahtumat (fi)", value: "Tapahtumat" }
          - { label: "Toiminta (fi)", value: "Toiminta" }
          - { label: "Tutkimus (fi)", value: "Tutkimus" }
          # ── English ──
          - { label: "In the media (en)", value: "In the media" }
          - { label: "Events (en)", value: "Events" }
          - { label: "Project activities (en)", value: "Project activities" }
          - { label: "Research (en)", value: "Research" }
          - { label: "News from (en)", value: "News from" }
          - { label: "Media (en)", value: "Media" }
          - { label: "University of Helsinki (en)", value: "University of Helsinki" }
          - { label: "Generation AI Monthly AI News – newsletter (en)", value: "Generation AI Monthly AI News (newsletter)" }
          # ── Svenska ──
          - { label: "I media (sv)", value: "I media" }
          - { label: "Evenemang (sv)", value: "Evenemang" }
          - { label: "Projektaktiviteter (sv)", value: "Projektaktiviteter" }
          - { label: "Forskning (sv)", value: "Forskning" }
          - { label: "Nyheter från (sv)", value: "Nyheter från" }
          - { label: "Helsingfors universitet (sv)", value: "Helsingfors universitet" }
          - { label: "Generation AI Monthly AI News – nyhetsbrev (sv)", value: "Generation AI Monthly AI News (nyhetsbrev)" }
      - label: "Lyhennelmä / Excerpt / Utdrag"
        name: "excerpt"
        widget: "text"
        required: false
        i18n: true
      - label: "Tarkempi tyyppi / Subcategories / Underkategorier"
        name: "subCategories"
        widget: "select"
        multiple: true
        required: false
        i18n: true
        options:
          # ── Suomi ──
          - { label: "Blogikirjoitus (fi)", value: "Blogikirjoitus" }
          - { label: "Haastattelu (fi)", value: "Haastattelu" }
          - { label: "Koulutus (fi)", value: "Koulutus" }
          - { label: "Konferenssit ja seminaarit (fi)", value: "Konferenssit ja seminaarit" }
          - { label: "Lehdistötiedote (fi)", value: "Lehdistötiedote" }
          - { label: "Mielipidekirjoitus (fi)", value: "Mielipidekirjoitus" }
          - { label: "Podcast (fi)", value: "Podcast" }
          - { label: "Tapahtuma (fi)", value: "Tapahtuma" }
          - { label: "Webinaari (fi)", value: "Webinaari" }
          - { label: "Työpaja (fi)", value: "Työpaja" }
          - { label: "YLE (fi)", value: "YLE" }
          # ── English ──
          - { label: "Blog post (en)", value: "Blog post" }
          - { label: "GenAI staff at events (en)", value: "GenAI project staff at events" }
          - { label: "GenAI staff in the media (en)", value: "GenAI project staff in the media" }
          - { label: "Opinion piece (en)", value: "Opinion piece" }
          - { label: "Webinar (en)", value: "Webinar" }
          - { label: "Children's rights (en)", value: "Children's rights" }
          - { label: "Conference proceedings (en)", value: "Conference proceedings" }
          - { label: "Press release (en)", value: "Press release" }
          - { label: "Published on (en)", value: "Published on" }
          # ── Svenska ──
          - { label: "Blogginlägg (sv)", value: "Blogginlägg" }
          - { label: "Debattartikel (sv)", value: "Debattartikel" }
          - { label: "GenAI personal i media (sv)", value: "GenAI-projektets personal i media" }
          - { label: "GenAI personal vid evenemang (sv)", value: "GenAI-projektets personal vid evenemang" }
          - { label: "Webbinarium (sv)", value: "Webbinarium" }
          - { label: "Barns rättigheter (sv)", value: "Barns rättigheter" }
          - { label: "Konferenshandlingar (sv)", value: "Konferenshandlingar" }
          - { label: "Pressmeddelande (sv)", value: "Pressmeddelande" }
          - { label: "Publicerad på (sv)", value: "Publicerad på" }
      - label: "Muut kategoriat / Extra categories / Extra kategorier"
        name: "extraCategories"
        widget: "select"
        multiple: true
        required: false
        i18n: true
        options:
          - "Esiopetus"
          - "FCAI"
          - "Helsingin yliopisto"
          - "Heureka"
          - "Itä-Suomen yliopisto"
          - "Luokittelija"
          - "Sovellukset"
          - "Yliopistojen uutiset"
          - "Youtube"
      - { label: "Avainsanat / Tags / Taggar", name: "tags", widget: "list", required: false, i18n: true }
      - { label: "Kuva (URL) / Featured image / Bild (URL)", name: "featuredImage", widget: "string", required: false, i18n: duplicate }
      - { label: "Kirjoittaja / Author / Författare", name: "author", widget: "string", required: false, default: "admin", i18n: duplicate }
      - label: "Noindexoi (älä näytä hakukoneille)"
        name: "noindex"
        widget: "boolean"
        required: false
        default: false
        i18n: duplicate
        hint: "Rastita lyhyille mediaviittauksille (YLE/MTV-uutinen jossa oma sisältö minimaalinen). Sivu pysyy näkyvissä sivustolla, mutta ei indeksoidu Googleen."
      - label: "Canonical-URL (uudelleenjulkaisu)"
        name: "canonicalUrl"
        widget: "string"
        required: false
        i18n: duplicate
        hint: "Jos artikkeli on uudelleenjulkaistu toiselta sivustolta (esim. UEF- tai Oulu-tiedote), liitä tähän alkuperäinen URL. Google ohjaa arvon hakutulosten kanoniseksi sivuksi."
      - { label: "Piilotettu", name: "hidden", widget: "hidden", required: false, i18n: duplicate }
      - { label: "Lähde-URL", name: "sourceUrl", widget: "hidden", required: false, i18n: duplicate }
      - { label: "EleventyExclude", name: "eleventyExcludeFromCollections", widget: "hidden", required: false, i18n: duplicate }
      - { label: "Sisältö / Content / Innehåll", name: "body", widget: "markdown", modes: ["rich_text", "raw"], i18n: true }

  - name: "pages_fi"
    label: "Sivut (suomi)"
    label_singular: "Sivu (suomi)"
    icon: "article"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    identifier_field: title
    summary: "{{title}} — {{permalink}}"
    preview_path: "{{permalink}}"
    sortable_fields:
      fields: ["date", "title"]
      default:
        field: date
        direction: Descending
    view_groups:
      - label: "Vuosi"
        field: date
        pattern: "\\d{4}"
    fields:
      - { label: "Otsikko", name: "title", widget: "string" }
      - { label: "Päivämäärä", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", required: false }
      - { label: "Päivitetty", name: "updated", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", required: false }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Kieli", name: "lang", widget: "hidden", default: "fi" }
      - { label: "Tyyppi", name: "sourceType", widget: "hidden", default: "pages" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/page.njk" }
      - { label: "Status", name: "status", widget: "hidden", default: "publish" }
      - { label: "Lyhennelmä", name: "excerpt", widget: "text", required: false }
      - { label: "Kategoriat", name: "categories", widget: "list", required: false }
      - { label: "Avainsanat", name: "tags", widget: "list", required: false }
      - { label: "Kuva (URL)", name: "featuredImage", widget: "string", required: false }
      - { label: "Sisältö", name: "body", widget: "markdown", modes: ["rich_text", "raw"] }

  - name: "pages_en"
    label: "Pages (English)"
    label_singular: "Page (English)"
    icon: "article"
    folder: "content/en/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    identifier_field: title
    summary: "{{title}} — {{permalink}}"
    preview_path: "{{permalink}}"
    sortable_fields:
      fields: ["date", "title"]
      default:
        field: date
        direction: Descending
    view_groups:
      - label: "Year"
        field: date
        pattern: "\\d{4}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", required: false }
      - { label: "Updated", name: "updated", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", required: false }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Source type", name: "sourceType", widget: "hidden", default: "pages" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/page.njk" }
      - { label: "Status", name: "status", widget: "hidden", default: "publish" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Featured image (URL)", name: "featuredImage", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown", modes: ["rich_text", "raw"] }

  # ── ITK-JULKAISUT JA WEBINAARIT ───────────────────────────────────────────
  - name: "itk"
    label: "ITK-julkaisut ja webinaarit"
    label_singular: "ITK-tapahtuma"
    icon: "school"
    files:
      - name: "itk_items"
        label: "ITK-julkaisut ja webinaarit"
        file: "src/_data/itk.json"
        fields:
          - label: "Tapahtumat"
            name: "items"
            widget: "list"
            summary: "{{fields.vuosi}} — {{fields.otsikko}}"
            fields:
              - { label: "Otsikko", name: "otsikko", widget: "string" }
              - { label: "Tekijät / Esiintyjät", name: "tekijat", widget: "string", required: false }
              - { label: "Vuosi", name: "vuosi", widget: "string" }
              - label: "Tyyppi"
                name: "tyyppi"
                widget: "select"
                options:
                  - { label: "Artikkeli", value: "Artikkeli" }
                  - { label: "Webinaari", value: "Webinaari" }
                  - { label: "Esitelmä", value: "Esitelma" }
                  - { label: "Esitys", value: "Esitys" }
              - { label: "Linkki", name: "linkki", widget: "string", required: false }
              - { label: "Kuvaus", name: "kuvaus", widget: "text", required: false }

  # ── SIDOSRYHMÄTAPAHTUMAT ───────────────────────────────────────────────────
  - name: "stakeholder_activities"
    label: "Sidosryhmätapahtumat"
    label_singular: "Tapahtuma"
    icon: "groups"
    files:
      - name: "activities"
        label: "Tapahtumat ja esitykset"
        file: "src/_data/stakeholderActivities.data.json"
        fields:
          - label: "Tapahtumat"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.stakeholder}}"
            fields:
              - { label: "Organisaatio / Tapahtuma", name: "stakeholder", widget: "string" }
              - { label: "Aihe / Otsikko", name: "title", widget: "string" }
              - { label: "Osallistujia", name: "participants", widget: "string", required: false, hint: "Luku tai N jos ei tiedossa" }
              - { label: "Päivämäärä", name: "date", widget: "string", required: false, hint: "Muodossa pp.kk.vvvv" }
              - { label: "Esittäjä(t)", name: "consortium", widget: "string", required: false, hint: "Hankkeen jäsenten lyhenteet, esim. MT, JL" }

  - name: "pages_sv"
    label: "Sidor (svenska)"
    label_singular: "Sida (svenska)"
    icon: "article"
    folder: "content/sv/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    identifier_field: title
    summary: "{{title}} — {{permalink}}"
    preview_path: "{{permalink}}"
    sortable_fields:
      fields: ["date", "title"]
      default:
        field: date
        direction: Descending
    view_groups:
      - label: "År"
        field: date
        pattern: "\\d{4}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", required: false }
      - { label: "Uppdaterad", name: "updated", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", required: false }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Språk", name: "lang", widget: "hidden", default: "sv" }
      - { label: "Källtyp", name: "sourceType", widget: "hidden", default: "pages" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/page.njk" }
      - { label: "Status", name: "status", widget: "hidden", default: "publish" }
      - { label: "Utdrag", name: "excerpt", widget: "text", required: false }
      - { label: "Kategorier", name: "categories", widget: "list", required: false }
      - { label: "Taggar", name: "tags", widget: "list", required: false }
      - { label: "Bild (URL)", name: "featuredImage", widget: "string", required: false }
      - { label: "Innehåll", name: "body", widget: "markdown", modes: ["rich_text", "raw"] }
