name: Sync Scientific Publications

on:
  schedule:
    - cron: "0 4 * * 1"   # Joka maanantai klo 04:00 UTC = 06:00 / 07:00 Suomi
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache API responses
        uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-researchfi-${{ github.run_id }}
          restore-keys: api-cache-researchfi-

      - name: Synkronoi julkaisut (OpenAlex + Research.fi)
        run: node scripts/sync-scientific-publications.js
        env:
          OPENALEX_MAILTO: jari.laru@gmail.com
          RESEARCHFI_LIMIT_PER_PERSON: "0"

      - name: Tallenna muutokset
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/_data/scientificPublications.data.json
          git diff --staged --quiet \
            && echo "Ei uusia julkaisuja — ei commitoida" \
            || git commit -m "Päivitä tieteelliset julkaisut (OpenAlex + Research.fi) [skip-tests]" \
            && git push
