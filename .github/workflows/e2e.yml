name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Ajettava testi (tyhjä = kaikki)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "keyboard-accessibility.spec.js"
          - "desktop-megamenu.spec.js"
          - "mobile-megamenu.spec.js"
          - "header-logo.spec.js"
          - "hero-consistency.spec.js"
          - "button-hover-colors.spec.js"
          - "material-buttons.spec.js"
          - "wcag-aa.spec.js"

  # TODO: Palauta pull_request- ja push-triggerit kun YLE-haun 500-virhe
  # (scripts/refresh-data-cache.js: Kamrul Faisal) on korjattu. Väliaikaisesti
  # pois käytöstä, jotta PR:t ja main-pushit eivät blokkaudu YLE:n vuoksi.
  # pull_request:
  #   branches: [main]
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - "scripts/**"
  #     - "_includes/**"
  #     - "content/**"
  #     - "styles/**"
  #     - "src/styles/**"
  #     - "src/scripts/**"
  #     - "tests/e2e/**"
  #     - "eleventy.config.js"
  #     - "playwright.config.js"
  #     - "package*.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Restore complete E2E API cache
        id: api-cache
        uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-e2e-v2-${{ runner.os }}-${{ hashFiles('src/_data/**/*.js', 'scripts/data-fetch-env.js', 'scripts/refresh-data-cache.js') }}
          restore-keys: |
            api-cache-e2e-v2-${{ runner.os }}-

      - name: Populate complete API cache
        if: steps.api-cache.outputs.cache-hit != 'true'
        run: npm run data:refresh

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Manuaalinen ajo voi valita yhden testin. PR:ssä ajetaan aina koko
      # sarja; main-pushissa valitaan muuttuneisiin tiedostoihin liittyvät testit.
      - name: Resolve test specs
        id: specs
        shell: bash
        run: |
          if [ -n "${{ inputs.spec }}" ]; then
            echo "pattern=tests/e2e/${{ inputs.spec }}" >> "$GITHUB_OUTPUT"
            echo "reason=manuaalinen: ${{ inputs.spec }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pattern=" >> "$GITHUB_OUTPUT"
            echo "reason=manuaalinen: kaikki testit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pattern=" >> "$GITHUB_OUTPUT"
            echo "reason=pull request: kaikki testit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="ALL"
          else
            CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" 2>/dev/null || echo "ALL")
          fi

          echo "Muuttuneet tiedostot:"
          echo "$CHANGED"

          if [ "$CHANGED" = "ALL" ]; then
            echo "pattern=" >> "$GITHUB_OUTPUT"
            echo "reason=kaikki (git diff epäonnistui)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SPECS=""

          if echo "$CHANGED" | grep -qF "scripts/accessibility.js"; then
            SPECS="$SPECS keyboard-accessibility.spec.js"
          fi

          if echo "$CHANGED" | grep -qE "scripts/nav\\.js|site-header\\.njk|megamenu|mobile-menu"; then
            SPECS="$SPECS desktop-megamenu.spec.js mobile-megamenu.spec.js header-logo.spec.js"
          fi

          if echo "$CHANGED" | grep -qE "src/styles/|styles/|\\.css$"; then
            SPECS="$SPECS button-hover-colors.spec.js material-buttons.spec.js wcag-aa.spec.js"
          fi

          if echo "$CHANGED" | grep -qE "layouts/|hero|page\\.njk|post\\.njk|base\\.njk"; then
            SPECS="$SPECS hero-consistency.spec.js wcag-aa.spec.js keyboard-accessibility.spec.js"
          fi

          if [ -z "$SPECS" ]; then
            echo "pattern=" >> "$GITHUB_OUTPUT"
            echo "reason=kaikki (ei tarkkaa osumaa)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UNIQUE=$(echo "$SPECS" | tr ' ' '\n' | sort -u | grep -v '^$')
          PATHS=$(echo "$UNIQUE" | sed 's|^|tests/e2e/|' | tr '\n' ' ' | xargs)
          NAMES=$(echo "$UNIQUE" | tr '\n' ' ' | xargs)

          echo "pattern=$PATHS" >> "$GITHUB_OUTPUT"
          echo "reason=valikoitu: $NAMES" >> "$GITHUB_OUTPUT"

      - name: "E2E-testit (${{ steps.specs.outputs.reason }})"
        run: |
          PAT="${{ steps.specs.outputs.pattern }}"
          if [ -z "$PAT" ]; then
            echo "Ajetaan kaikki testit"
            npm run test:e2e
          else
            echo "Ajetaan: $PAT"
            npx playwright test $PAT
          fi
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
