name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip-tests]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build:live

      - name: Security – HSTS-header löytyy
        run: grep -q "Strict-Transport-Security" _site/_headers

      - name: Security – robots.txt löytyy
        run: test -f _site/robots.txt

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E-testit
        run: npm run test:e2e
        env:
          CI: "true"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ github.pages_url }}
    steps:
      - uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Tarkista tuotanto-URL:t
        run: |
          for url in \
            https://generation-ai-stn.fi/ \
            https://generation-ai-stn.fi/en/ \
            https://generation-ai-stn.fi/robots.txt \
            https://generation-ai-stn.fi/sitemap.xml; do
            code=$(curl -o /dev/null -s -w "%{http_code}" --retry 5 --retry-delay 5 --retry-all-errors "$url")
            echo "$url → $code"
            test "$code" = "200"
          done
